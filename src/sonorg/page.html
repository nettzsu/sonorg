<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sonorg</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14120e;
    --ink: #e7e1d6;
    --dim: #9a917f;
    --line: #2c2822;
    --brass: #c4a574;
    --bad: #d47a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 28px; }
  h1 { font: 600 28px/1 ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; letter-spacing: -0.03em; }
  header p { margin: 0; color: var(--dim); max-width: 46em; }
  form { display: grid; gap: 12px; margin: 24px 0; }
  label { display: grid; gap: 6px; color: var(--dim); font-size: 13px; }
  input[type=url], input[type=file] {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
  }
  button, a.button {
    justify-self: start;
    background: var(--brass);
    color: #1a150f;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font: 600 14px/1.2 ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    text-decoration: none;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { min-height: 1.4em; color: var(--dim); }
  #status.error { color: var(--bad); }
  .layout { display: grid; gap: 20px; }
  @media (min-width: 800px) { .layout { grid-template-columns: 1fr 1fr; } }
  article, pre {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    min-height: 8em;
  }
  article h2, .pane h2 { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; color: var(--dim); margin: 0 0 12px; }
  .chapter { margin: 0 0 14px; }
  .chapter button {
    background: none;
    color: var(--brass);
    padding: 0;
    font: 600 15px/1.3 ui-sans-serif, system-ui, sans-serif;
  }
  .chapter p, .lead { margin: 4px 0 12px; white-space: pre-wrap; }
  pre {
    margin: 0;
    white-space: pre-wrap;
    font: 13px/1.45 ui-monospace, "Iosevka Nerd Font", monospace;
  }
  iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 8px; margin-top: 12px; background: #000; }
  .hidden { display: none; }
  footer { margin-top: 28px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>sonorg</h1>
    <p>Paste a YouTube link or drop an audio file. sonorg writes the speech up as org notes: the ideas, under ordinary headings.</p>
  </header>
  <form id="job">
    <label>YouTube URL
      <input type="url" name="url" placeholder="https://www.youtube.com/watch?v=...">
    </label>
    <label>or an audio file
      <input type="file" name="file" accept="audio/*,video/*">
    </label>
    <button type="submit">Make notes</button>
  </form>
  <p id="status"></p>
  <div class="layout hidden" id="result">
    <section>
      <article id="notes"><h2>Notes</h2></article>
      <iframe id="player" class="hidden" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </section>
    <section class="pane">
      <h2>Org <a class="button" id="download" href="#">Download</a></h2>
      <pre id="org"></pre>
    </section>
  </div>
  <footer>Runs on this machine. One video is one free Gemini call. Leave billing off in AI Studio.</footer>
</main>
<script>
const form = document.querySelector("#job");
const status = document.querySelector("#status");
const result = document.querySelector("#result");
const notes = document.querySelector("#notes");
const org = document.querySelector("#org");
const player = document.querySelector("#player");
const download = document.querySelector("#download");
const submit = form.querySelector("button");

function setStatus(text, failed) {
  status.textContent = text || "";
  status.classList.toggle("error", Boolean(failed));
}

function show(job) {
  result.classList.remove("hidden");
  org.textContent = job.org || "";
  download.href = "/job/" + job.id + "/note.org";
  download.download = "sonorg.org";
  notes.replaceChildren();
  const title = document.createElement("h2");
  title.textContent = job.title || "Notes";
  notes.append(title);
  if (job.overview) {
    const lead = document.createElement("p");
    lead.className = "lead";
    lead.textContent = job.overview;
    notes.append(lead);
  }
  for (const chapter of job.chapters || []) {
    const block = document.createElement("div");
    block.className = "chapter";
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = chapter.heading || "Section";
    if (chapter.stamp) button.title = "Play from " + chapter.stamp;
    button.addEventListener("click", () => {
      if (!job.video_id) return;
      player.classList.remove("hidden");
      player.src = "https://www.youtube-nocookie.com/embed/" + job.video_id + "?start=" + Math.floor(chapter.start) + "&autoplay=1";
    });
    const paragraph = document.createElement("p");
    paragraph.textContent = chapter.paragraph || "";
    block.append(button, paragraph);
    notes.append(block);
  }
  if (job.video_id) player.classList.remove("hidden");
}

async function poll(id) {
  const response = await fetch("/job/" + id);
  const job = await response.json();
  if (!response.ok) {
    setStatus(job.detail || "Lost the job.", true);
    submit.disabled = false;
    return;
  }
  if (job.status === "done") {
    setStatus("Done.");
    show(job);
    submit.disabled = false;
    return;
  }
  if (job.status === "error") {
    setStatus(job.error || "Failed.", true);
    submit.disabled = false;
    return;
  }
  setStatus(job.stage || "Working");
  setTimeout(() => poll(id), 700);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = true;
  setStatus("Starting");
  result.classList.add("hidden");
  const response = await fetch("/job", { method: "POST", body: new FormData(form) });
  const body = await response.json();
  if (!response.ok) {
    setStatus(body.detail || "Could not start.", true);
    submit.disabled = false;
    return;
  }
  poll(body.id);
});
</script>
</body>
</html>
