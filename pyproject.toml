[project]
name = "sonorg"
version = "0.1.0"
description = "Write a speech up as an org file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "typer",
  "python-multipart",
  "faster-whisper",
  "openai",
  "yt-dlp[default,deno]",
]

[project.scripts]
sonorg = "sonorg.cli:app"

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
